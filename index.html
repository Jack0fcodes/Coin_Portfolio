<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Coin Portfolio — Image Test</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0b1220;color:#e8eef8;font-family:system-ui,-apple-system,Segoe UI,sans-serif;padding:24px}
    main{width:min(100%,560px);padding:28px;border:1px solid #263449;border-radius:24px;background:#121c2d;text-align:center;box-shadow:0 20px 60px #0003}
    .coin{width:min(220px,70vw);height:auto;display:block;margin:8px auto 22px;filter:drop-shadow(0 14px 22px #0005)}
    h1{font-size:clamp(1.5rem,5vw,2.2rem);margin:0 0 10px}
    p{color:#9fb0c7;margin:0;line-height:1.6}
    .tag{display:inline-block;margin-top:20px;padding:7px 12px;border-radius:999px;background:#183b32;color:#8de0b5;font-size:.8rem}
  </style>
</head>
<body>
  <main>
    <svg class="coin" viewBox="0 0 240 240" role="img" aria-label="Illustration of a gold coin">
      <defs>
        <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#fff0a8"/><stop offset=".45" stop-color="#e8b94f"/><stop offset="1" stop-color="#a66b19"/>
        </linearGradient>
      </defs>
      <circle cx="120" cy="120" r="108" fill="#7c4b12"/>
      <circle cx="120" cy="120" r="101" fill="url(#gold)" stroke="#ffdf80" stroke-width="4"/>
      <circle cx="120" cy="120" r="86" fill="none" stroke="#9c681d" stroke-width="3" stroke-dasharray="3 5"/>
      <circle cx="120" cy="120" r="74" fill="none" stroke="#fff0ad" stroke-width="2"/>
      <text x="120" y="145" text-anchor="middle" font-size="76" font-family="Georgia,serif" font-weight="bold" fill="#8c5817">$</text>
      <text x="120" y="66" text-anchor="middle" font-size="13" letter-spacing="3" font-family="system-ui" fill="#8c5817">COIN PORTFOLIO</text>
      <text x="120" y="188" text-anchor="middle" font-size="11" letter-spacing="2" font-family="system-ui" fill="#8c5817">IMAGE TEST</text>
    </svg>
    <h1>Coin Portfolio</h1>
    <p>Test image added to your GitHub Pages index.</p>
    <span class="tag">Image test • HTML page</span>
  </main>
</body>
</html>
